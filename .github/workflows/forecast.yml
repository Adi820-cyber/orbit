name: Outbreak forecast

# Daily XGBoost forecast for the outbreak watch (ADR 0023): reads patients per
# hospital, condition and day (counts only), trains, checks itself against a
# naive baseline on held-out weeks, and stores the forecast for Orbit.
#
# Needs DATABASE_URL (the pooler string as orbit_app, the same secret the
# knowledge sync uses). Skipped, and green, until it is set.

on:
  schedule:
    - cron: '30 1 * * *'   # 07:00 IST, after the night's visits are in
  workflow_dispatch:

concurrency:
  group: outbreak-forecast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_DATABASE: ${{ secrets.DATABASE_URL != '' }}
    defaults:
      run:
        working-directory: tools/forecast

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/forecast/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest -v test_forecast.py

      - name: Forecast
        if: env.HAS_DATABASE == 'true'
        run: python forecast.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Not configured
        if: env.HAS_DATABASE != 'true'
        run: echo "DATABASE_URL is not set; the forecast was not run."
